[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "checkpc-analysis-pipeline"
version = "3.70.0"
description = "Local-LLM analysis pipeline for CheckPC triage artifacts"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.30,<2",
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
  "python-multipart>=0.0.9,<1",
  "pydantic>=2,<3",
  "PyYAML>=6,<7",
  "requests>=2.31,<3",
  "reportlab>=4,<5",
  "httpx>=0.27,<1",
]
