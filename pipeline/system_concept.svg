<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">CheckPC解析パイプライン システム概念図</title>
<desc id="desc">CABまたはTXTをローカル解析し、決定論ルール、Depth選抜、ローカルLLM、横断相関、レポート、バックグラウンドZIP、案件内検索、任意VirusTotal照会へ処理する流れ。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><style>
.bg{fill:#f8fafc}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:14}.local{fill:#eff6ff;stroke:#60a5fa}.out{fill:#f0fdf4;stroke:#4ade80}.opt{fill:#fff7ed;stroke:#fb923c}.audit{fill:#f5f3ff;stroke:#a78bfa}.t{font-family:'Noto Sans CJK JP','Yu Gothic UI','Meiryo',sans-serif;fill:#0f172a}.title{font-size:23px;font-weight:700}.head{font-size:16px;font-weight:700}.text{font-size:13px}.small{font-size:11px;fill:#64748b}.a{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.d{stroke:#fb923c;stroke-width:2.5;fill:none;stroke-dasharray:8 6;marker-end:url(#arrow)}
</style></defs>
<rect class="bg" width="1200" height="760"/><text class="t title" x="45" y="42">CheckPC解析パイプライン — 現在の処理フロー</text><text class="t small" x="45" y="66">通常解析はローカルで完結し、外部通信は許可されたIOCの任意照会だけです。</text>
<rect class="box" x="40" y="120" width="180" height="145"/><text class="t head" x="63" y="153">① 利用者 / Web GUI</text><text class="t text" x="63" y="182">CAB / TXT投入</text><text class="t text" x="63" y="207">Depth・FULL/LEAN</text><text class="t text" x="63" y="232">進捗・レポート確認</text>
<rect class="box local" x="285" y="92" width="565" height="355"/><text class="t head" x="310" y="124">② ローカル解析サーバー</text>
<rect class="box" x="315" y="150" width="220" height="72"/><text class="t head" x="335" y="179">受付・ジョブキュー</text><text class="t small" x="335" y="201">安全な展開 / 構造化 / 進捗</text>
<rect class="box" x="595" y="150" width="220" height="72"/><text class="t head" x="615" y="179">決定論ルール・Depth選抜</text><text class="t small" x="615" y="201">known tools / provenance</text>
<rect class="box" x="315" y="255" width="220" height="72"/><text class="t head" x="335" y="284">ローカルLLM</text><text class="t small" x="335" y="306">セクション別所見評価</text>
<rect class="box" x="595" y="255" width="220" height="72"/><text class="t head" x="615" y="284">横断相関</text><text class="t small" x="615" y="306">相関retry / deterministic fallback</text>
<rect class="box audit" x="315" y="360" width="220" height="60"/><text class="t head" x="335" y="387">Chat Lv.2</text><text class="t small" x="335" y="408">案件内検索 / 監査ログ</text>
<rect class="box" x="595" y="360" width="220" height="60"/><text class="t head" x="615" y="387">archive worker</text><text class="t small" x="615" y="408">全ジョブ合計1件・状態poll</text>
<path class="a" d="M535 186H595"/><path class="a" d="M705 222V255"/><path class="a" d="M595 291H535"/><path class="a" d="M425 327V360"/><path class="a" d="M705 327V360"/><path class="a" d="M220 190H285"/>
<rect class="box out" x="915" y="105" width="240" height="265"/><text class="t head" x="940" y="139">③ 解析結果</text><text class="t text" x="940" y="171">標準 / 全件レポート</text><text class="t text" x="940" y="198">タイムライン / Defender集約</text><text class="t text" x="940" y="225">Markdown / PDF / JSON</text><text class="t text" x="940" y="266">検証用ZIP</text><text class="t small" x="940" y="286">parsedなし・日常比較用</text><text class="t text" x="940" y="320">全成果物ZIP</text><text class="t small" x="940" y="340">parsedあり・完全監査用</text><path class="a" d="M850 225H915"/>
<rect class="box local" x="285" y="510" width="565" height="145"/><text class="t head" x="310" y="543">④ ローカル保存領域</text><text class="t text" x="310" y="574">入力 / parsed / analyzed / correlation / report / archive</text><text class="t text" x="310" y="601">案件フォルダとsource_idで証拠を追跡</text><text class="t small" x="310" y="629">ジョブ削除時は監査fallbackとZIPを含めて削除。必要な成果物は先に保存します。</text><path class="a" d="M568 447V510"/>
<rect class="box opt" x="915" y="510" width="240" height="145"/><text class="t head" x="940" y="543">⑤ VirusTotal（任意）</text><text class="t text" x="940" y="574">許可されたhash / 外部IP / FQDN</text><text class="t text" x="940" y="601">だけを外部照会</text><text class="t small" x="940" y="629">予約・private・特殊用途IP等は送信前拒否</text><path class="d" d="M535 390C790 450 820 570 915 580"/>
<rect x="40" y="700" width="1115" height="34" rx="10" fill="#e2e8f0"/><text class="t small" x="60" y="722">監査: 外部照会は実行前予約と実行後完了を記録。相関fallbackや出力切断はJSONとレポートの両方へ明示します。</text>
</svg>
