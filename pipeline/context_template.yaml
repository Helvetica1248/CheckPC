# =============================================================
# CheckPC 解析パイプライン  追加コンテキストファイル
# =============================================================
# 使い方:
#   python run_analysis.py <input> --context-file context.yaml
#   python run_analysis.py <input> -f context.yaml
#
# ここに書いた情報は、すべての LLM 解析のシステムプロンプトに
# 挿入されます。LLM が「何を重点的に疑うべきか」を事前に知ることで
# 判定精度が上がります。
#
# ルール:
#   - 全項目は「任意」です。不要な項目は削除または # でコメントアウト
#   - 合計 800 文字を超えると自動トリミングされます（警告が出ます）
#   - PDFレポートや記事の重要箇所は notes にそのままコピペ可
# =============================================================


# ── 脅威アクター ──────────────────────────────────────────────
# 誰の攻撃か分かっている場合に記載します。
# 例: "Kimsuky", "APT29", "Lazarus Group"
#
# threat_actor: ""


# ── マルウェアファミリー ──────────────────────────────────────
# 使用されているマルウェアが特定されている場合に記載します。
# 例: "Remcos RAT", "Emotet", "Cobalt Strike"
#
# malware_family: ""


# ── 既知 C2・不審な通信先 ────────────────────────────────────
# 攻撃者のサーバーや不審な通信先を列挙します。
# DNS キャッシュ・netstat との照合に役立ちます。
# 形式: ドメイン名、IP アドレス、または "IP:ポート番号"
#
# known_c2:
#   - "evil.example.com"
#   - "1.2.3.4:443"
#   - "198.51.100.10"


# ── 既知 IOC（侵害指標） ─────────────────────────────────────
# ハッシュ値やその他の IOC を記載します。
# defender_quarantine・directory との照合に役立ちます。
# 形式: "種別: 値" の形式を推奨
#
# known_iocs:
#   - "SHA256: abc123def456..."
#   - "MD5: 1a2b3c4d5e6f..."
#   - "ファイル名: evil.exe"


# ── 感染経緯・キャンペーン情報（自由記述） ───────────────────
# CTI レポートや社内情報から重要箇所をコピペしてください。
# タスクスケジューラ・サービス・prefetch の判定精度が上がります。
# ここは複数行で書けます（"|" の後ろに続けて書く）。
#
# notes: |
#   2026年5月に確認されたキャンペーン。
#   RDP 経由で初期侵入後、wmic を AppData\Temp にコピーして実行。
#   Remcos RAT を C:\Users\Public\Libraries\ に配置して永続化。
#   既知の横展開先: 192.168.x.x/24 の 445/TCP を優先スキャン。
